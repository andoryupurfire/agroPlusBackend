services:
  postgres_db:
    image: postgres:15
    container_name: agro_plus_db
    environment:
      POSTGRES_DB: agro_plus
      POSTGRES_USER: agro_admin
      POSTGRES_PASSWORD: agro1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: no

volumes:
  postgres_data: