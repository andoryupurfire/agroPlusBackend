services:

  postgres_db:
    image: postgres:15
    container_name: agro_plus_db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: no


  agroplus-backend:
    build: .
    container_name: agroplus-backend

    ports:
      - "8081:8081"

    environment:
      DB_URL: jdbc:postgresql://postgres_db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      - postgres_db

    restart: no


volumes:
  postgres_data: