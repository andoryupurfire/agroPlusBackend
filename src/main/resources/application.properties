# ===== BASE DE DATOS =====

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agro_plus}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:agro_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme-local-dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / HIBERNATE =====

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== SERVIDOR =====

server.port=${PORT:8081}

# ===== JWT =====
jwt.secret=${JWT_SECRET:valor-de-desarrollo-local-no-usar-en-produccion}